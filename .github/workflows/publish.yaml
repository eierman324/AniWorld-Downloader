name: Attach Python package to release

# In this fork the package goes to the GitHub release only. The original
# project publishes `aniworld` to PyPI; this fork must not.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  package:
    name: Build and attach the Python package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distribution
        run: python -m build

      - name: Upload dist files to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
